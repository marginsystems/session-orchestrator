<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Office</title>
<style>
:root{color-scheme:dark;--bg:#1a1c2c}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#stage{height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;scrollbar-width:none;background:repeating-conic-gradient(#1a1c2c 0 25%,#202339 0 50%) 0 0/8px 8px}
#stage::-webkit-scrollbar{display:none}
#wrap{position:relative;margin:0 auto;flex:none}
canvas{display:block;image-rendering:pixelated}
#ui{position:fixed;left:0;top:0;display:none;pointer-events:none}
#ui.on{display:block}
#hit{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
.hb{position:absolute;background:transparent;border:0;padding:0;margin:0;cursor:pointer;pointer-events:auto;touch-action:none;outline:none;-webkit-tap-highlight-color:transparent;font:inherit;color:transparent}
#stat{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="cv" aria-label="Agent office"></canvas><button id="gear" class="hb" type="button" aria-label="Open settings" aria-haspopup="dialog"></button></div></div>
<div id="ui"><canvas id="uc" aria-hidden="true"></canvas><div id="hit"></div></div>
<div id="stat" role="status"></div>
<script src="office/base.js"></script>
<script src="office/sprites.js"></script>
<script src="office/props.js"></script>
<script src="office/building.js"></script>
<script src="office/actors.js"></script>
<script src="office/render.js"></script>
<script src="office/behavior.js"></script>
<script src="office/data.js"></script>
<script src="office/demo.js"></script>
<script src="office/ui.js"></script>
<script src="office/tour.js"></script>
<script src="office/main.js"></script>
</body>
</html>
