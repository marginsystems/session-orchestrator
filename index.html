<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>

</style>
</head>
<body>
<div id="stage"><canvas id="cv" aria-label="Agent office"></canvas></div>
<div id="stat" role="status"></div>
<script>
(() => {
'use strict';
const Q = new URLSearchParams(location.search);
const DEMO = Q.has('demo');
const SPEED = Number(Q.get('speed')) || 1;
const NIGHT = Q.has('night');
const HUD = Q.get('hud') !== '0';
const AUTOFOCUS = Q.get('autofocus') !== '0';

const MINLW = 370, MAXLW = 560, HUDH = 14, ROOFH = 12, GRND = 8, HF_MIN = 64, HF_MAX = 84, BM = 6, LABW = 58, SHAFT = 26, FB = 11, MAXS = 6;
const LOBBY = '__lobby', BOSS = '__boss', DESK_W = 28, BOSS_DESK_W = 46, VIS_DX = 17;
const TEXTS = ['GOT A SEC?', "PR'S UP", 'HANDING OFF', 'NEED EYES', 'DONE!'];
const BOSS_TEXTS = ['GOT A DECISION', 'NEED A CALL', 'UPDATE!'];

const PAL = { '0': '#1a1c2c', '1': '#5d275d', '2': '#b13e53', '3': '#ef7d57', '4': '#ffcd75', '5': '#a7f070', '6': '#38b764', '7': '#257179', '8': '#29366f', '9': '#3b5dc9', a: '#41a6f6', b: '#73eff7', c: '#f4f4f4', d: '#94b0c2', e: '#566c86', f: '#333c57', g: '#a0623a', h: '#c98a4b', i: '#5f3a2e', j: '#e0b070', k: '#c4915a', m: '#f7e6bd', n: '#8a4b2a', p: '#b86fd1', q: '#7a2c3d', r: '#5a1f2e' };
const WALLS = [['#2f8f8b', '#237370'], ['#8a4f9e', '#6e3b82'], ['#4a6fd0', '#3a58ac'], ['#4fa05e', '#3b8049'], ['#d0714f', '#b05a3d'], ['#d1a24a', '#b38836']];
const WALL_LOBBY = ['#e8d3a8', '#caa97a'], WALL_BOSS = ['#4a3b6b', '#352a50'];

const FUR = [
  { o: '#5d275d', b: '#ef7d57', s: '#b13e53', l: '#ffcd75' },
  { o: '#29366f', b: '#41a6f6', s: '#3b5dc9', l: '#73eff7' },
  { o: '#257179', b: '#a7f070', s: '#38b764', l: '#f4f4f4' },
  { o: '#8a4b2a', b: '#ffcd75', s: '#ef7d57', l: '#f4f4f4' },
  { o: '#1a1c2c', b: '#e0566e', s: '#b13e53', l: '#ef7d57' },
  { o: '#333c57', b: '#94b0c2', s: '#566c86', l: '#f4f4f4' },
  { o: '#257179', b: '#73eff7', s: '#41a6f6', l: '#f4f4f4' },
  { o: '#5d275d', b: '#b86fd1', s: '#7d4698', l: '#e0b4f0' },
];
const BOSS_FUR = { o: '#1a1c2c', b: '#8a4fa8', s: '#5d275d', l: '#c58be0' };
const ACCS = ['#ffcd75', '#41a6f6', '#b13e53', '#a7f070', '#f4f4f4', '#ef7d57'];

const lerp = (a, b, t) => a + (b - a) * t;
const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const walkEase = (p) => 0.4 * p + 0.6 * ease(p);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hn(n) { n = Math.imul(n ^ (n >>> 15), 2246822507); n = Math.imul(n ^ (n >>> 13), 3266489909); return (n ^ (n >>> 16)) >>> 0; }
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function mix(hex, to, t) {
  const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16);
  const c = (s) => Math.round(lerp((a >> s) & 255, (b >> s) & 255, t));
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}

const GLYPHS = {
  A: [14, 17, 17, 31, 17, 17, 17], B: [30, 17, 17, 30, 17, 17, 30], C: [14, 17, 16, 16, 16, 17, 14], D: [30, 17, 17, 17, 17, 17, 30], E: [31, 16, 16, 30, 16, 16, 31], F: [31, 16, 16, 30, 16, 16, 16], G: [14, 17, 16, 23, 17, 17, 15], H: [17, 17, 17, 31, 17, 17, 17], I: [14, 4, 4, 4, 4, 4, 14], J: [7, 2, 2, 2, 2, 18, 12], K: [17, 18, 20, 24, 20, 18, 17], L: [16, 16, 16, 16, 16, 16, 31], M: [17, 27, 21, 21, 17, 17, 17], N: [17, 17, 25, 21, 19, 17, 17], O: [14, 17, 17, 17, 17, 17, 14], P: [30, 17, 17, 30, 16, 16, 16], Q: [14, 17, 17, 17, 21, 18, 13], R: [30, 17, 17, 30, 20, 18, 17], S: [15, 16, 16, 14, 1, 1, 30], T: [31, 4, 4, 4, 4, 4, 4], U: [17, 17, 17, 17, 17, 17, 14], V: [17, 17, 17, 17, 17, 10, 4], W: [17, 17, 17, 21, 21, 21, 10], X: [17, 17, 10, 4, 10, 17, 17], Y: [17, 17, 17, 10, 4, 4, 4], Z: [31, 1, 2, 4, 8, 16, 31],
  0: [14, 17, 19, 21, 25, 17, 14], 1: [4, 12, 4, 4, 4, 4, 14], 2: [14, 17, 1, 2, 4, 8, 31], 3: [31, 2, 4, 2, 1, 17, 14], 4: [2, 6, 10, 18, 31, 2, 2], 5: [31, 16, 30, 1, 1, 17, 14], 6: [6, 8, 16, 30, 17, 17, 14], 7: [31, 1, 2, 4, 8, 8, 8], 8: [14, 17, 17, 14, 17, 17, 14], 9: [14, 17, 17, 15, 1, 2, 12],
  '.': [0, 0, 0, 0, 0, 12, 12], '!': [4, 4, 4, 4, 4, 0, 4], '?': [14, 17, 1, 2, 4, 0, 4], "'": [4, 4, 8, 0, 0, 0, 0], '-': [0, 0, 0, 31, 0, 0, 0], ':': [0, 12, 12, 0, 12, 12, 0], ',': [0, 0, 0, 0, 12, 4, 8], '_': [0, 0, 0, 0, 0, 0, 31], '/': [1, 1, 2, 4, 8, 16, 16], '+': [0, 4, 4, 31, 4, 4, 0], '=': [0, 0, 31, 0, 31, 0, 0], ' ': [0, 0, 0, 0, 0, 0, 0],
};
const tcache = new Map();
function textCv(t, col) {
  const k = col + '|' + t;
  let cv = tcache.get(k);
  if (cv) return cv;
  if (tcache.size > 400) tcache.clear();
  cv = document.createElement('canvas');
  cv.width = Math.max(1, t.length * 6 - 1); cv.height = 7;
  const c = cv.getContext('2d');
  c.fillStyle = col;
  [...t].forEach((ch, i) => {
    const g = GLYPHS[ch] || GLYPHS['-'];
    for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++) if (g[y] & (16 >> x)) c.fillRect(i * 6 + x, y, 1, 1);
  });
  tcache.set(k, cv);
  return cv;
}
const textW = (t) => Math.max(0, t.length * 6 - 1);
function text(c, t, x, y, col) { if (t) c.drawImage(textCv(t, col), Math.round(x), Math.round(y)); }
const up = (s) => String(s).toUpperCase();

const EARS = {
  cat: ['..oo......oo..', '..obo....obo..'],
  bear: ['..ooo....ooo..', '.obbbo..obbbo.'],
  bulb: ['.......aa.....', '.......oo.....'],
};
const HEAD = ['...oooooooo...', '..obbbbbbbbo..', '.obllbbbbbbbo.', '.oblbbbbbbbbo.', '.obbbbbbbbbbo.', '.obbbbbbbbbbo.', '.obbbbbbbbbso.', '..obbbbbbbsso.', '...oossssoo...'];
const ACC = {
  cap: { 1: '....oaaaao....', 2: '...oaaaaaao...', 3: '..oaaaaaaaao..', 4: '..oaaaaaaaaaoo' },
  phones: { 1: '....oooooo....', 2: '...o......o...', 3: '..o........o..', 4: '..o........o..', 5: '..o........o..', 6: '.ooo......ooo.', 7: '.oaao....oaao.', 8: '.oaao....oaao.', 9: '.ooo......ooo.' },
  bow: { 1: '........oo.oo.', 2: '........aaoaa.', 3: '........oo.oo.' },
  glasses: { 5: '......oooooo..', 6: '......o.oo.o..', 7: '......o.oo.o..', 8: '......oooooo..' },
  crown: { 0: '...a..aa..a...', 1: '...aaaaaaaaaa.', 2: '...aaraaraaa..' },
};
const FACES = {
  neutral: [[7, 6, 'k'], [7, 7, 'k'], [10, 6, 'k'], [10, 7, 'k'], [9, 9, 'k'], [6, 8, 'c'], [11, 8, 'c']],
  blink: [[7, 7, 'k'], [10, 7, 'k'], [9, 9, 'k'], [6, 8, 'c'], [11, 8, 'c']],
  focus: [[7, 5, 'k'], [8, 5, 'k'], [10, 5, 'k'], [11, 5, 'k'], [7, 6, 'k'], [7, 7, 'k'], [10, 6, 'k'], [10, 7, 'k'], [8, 9, 'k'], [9, 9, 'k'], [6, 8, 'c'], [11, 8, 'c']],
  wait: [[7, 5, 'k'], [7, 6, 'k'], [10, 5, 'k'], [10, 6, 'k'], [8, 9, 'k'], [9, 9, 'k'], [6, 8, 'c'], [11, 8, 'c']],
  happy: [[6, 7, 'k'], [7, 6, 'k'], [8, 7, 'k'], [9, 7, 'k'], [10, 6, 'k'], [11, 7, 'k'], [8, 9, 'k'], [9, 9, 'k'], [6, 8, 'c'], [11, 8, 'c']],
  wow: [[7, 6, 'w'], [8, 6, 'w'], [7, 7, 'w'], [8, 7, 'k'], [10, 6, 'w'], [11, 6, 'w'], [10, 7, 'w'], [11, 7, 'k'], [9, 9, 'k'], [6, 8, 'c'], [11, 8, 'c']],
  sleep: [[7, 7, 'k'], [8, 7, 'k'], [10, 7, 'k'], [11, 7, 'k'], [9, 9, 'k'], [6, 8, 'c'], [11, 8, 'c']],
  yawn: [[7, 6, 'k'], [8, 7, 'k'], [7, 8, 'k'], [11, 6, 'k'], [10, 7, 'k'], [11, 8, 'k'], [8, 9, 'k'], [9, 9, 'k'], [8, 10, 'k'], [9, 10, 'k']],
};
const TORSO = ['...oaaaaaao...', '.obobbllbbobo.', '.obobbbbbbobo.'];
const LEGS = {
  A: ['...ob....bo...', '..ooo....ooo..'],
  B: ['.....obbo.....', '....oooooo....'],
  C: ['....ob..bo....', '...ooo..ooo...'],
};
const WALK = ['A', 'B', 'C', 'B'];
const SIT = ['...oaaaaaaoooo', '...obbllbbbbbo', '...obbbbbboooo', '...obbbbbbbbbo', '.........obbo.', '.........oooo.'];
const BOSS_TIE = [[7, 1], [8, 1], [7, 2], [8, 2]];
const ARMS_UP = ['oo..........oo', 'bo..........ob', 'bo..........ob', 'bo..........ob', 'bo..........ob', 'oo..........oo'];

const bcache = new Map();
function bake(key, w, h, grid, map) {
  let cv = bcache.get(key);
  if (cv) return cv;
  if (bcache.size > 1500) bcache.clear();
  cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = grid[y] || '';
    if (row.length !== w && row.length) console.error('bad sprite row width', key, y, row.length);
    for (let x = 0; x < row.length; x++) { const col = map[row[x]]; if (col) { c.fillStyle = col; c.fillRect(x, y, 1, 1); } }
  }
  bcache.set(key, cv);
  return cv;
}
const charMap = (st) => ({ o: st.fur.o, b: st.fur.b, s: st.fur.s, l: st.fur.l, a: st.acc, k: '#1a1c2c', c: '#ff7a9c', w: '#f4f4f4', r: '#b13e53' });

function styleFor(id, boss) {
  if (boss) return { boss: true, fur: BOSS_FUR, acc: '#ffcd75', ear: 'bear', accKind: 'crown', screen: 0, key: 'boss' };
  const h = hash(id);
  const fi = h % FUR.length;
  let acc = ACCS[(h >>> 7) % ACCS.length];
  if (acc.toLowerCase() === FUR[fi].b.toLowerCase()) acc = ACCS[((h >>> 7) + 1) % ACCS.length];
  return { boss: false, fur: FUR[fi], acc, ear: ['cat', 'bear', 'bulb'][(h >>> 5) % 3], accKind: ['cap', 'phones', 'bow', 'glasses'][(h >>> 3) % 4], screen: (h >>> 11) % 2, key: fi + acc + h % 1000 };
}
function headCv(st, face, shift) {
  const key = `h|${st.key}|${face}|${shift}`;
  let cv = bcache.get(key);
  if (cv) return cv;
  const grid = Array.from({ length: 11 }, () => Array(14).fill('.'));
  EARS[st.ear].forEach((r, i) => { for (let x = 0; x < 14; x++) if (r[x] !== '.') grid[i][x] = r[x]; });
  HEAD.forEach((r, i) => { for (let x = 0; x < 14; x++) if (r[x] !== '.') grid[i + 2][x] = r[x]; });
  for (const [x, y, k] of FACES[face]) { const xx = x + shift; if (xx >= 0 && xx < 14) grid[y][xx] = k; }
  const acc = ACC[st.accKind];
  for (const y of Object.keys(acc)) { const r = acc[y]; for (let x = 0; x < 14; x++) if (r[x] !== '.') grid[+y][x] = st.accKind === 'glasses' ? 'k' : r[x]; }
  return bake(key, 14, 11, grid.map((r) => r.join('')), charMap(st));
}
function standBodyCv(st, f) {
  const key = `sb|${st.key}|${f}`;
  const grid = [...TORSO, ...LEGS[f]].map((r) => r.split(''));
  if (st.boss) for (const [x, y] of BOSS_TIE) grid[y][x] = 'r';
  return bake(key, 14, 5, grid.map((r) => r.join('')), charMap(st));
}
function sitBodyCv(st) {
  const key = `sit|${st.key}`;
  const grid = SIT.map((r) => r.split(''));
  if (st.boss) for (const [x, y] of BOSS_TIE) if (grid[y][x] !== 'o') grid[y][x] = 'r';
  return bake(key, 14, 6, grid.map((r) => r.join('')), charMap(st));
}
function armsUpCv(st) { return bake(`au|${st.key}`, 14, 6, ARMS_UP, charMap(st)); }

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stageEl = document.getElementById('stage');
const statEl = document.getElementById('stat');
const stCv = document.createElement('canvas');
const stC = stCv.getContext('2d');

const S = { rooms: [], floors: [BOSS, LOBBY], agents: new Map(), slots: new Map(), Hf: 70, s: 2, dpr: 1, LW: 380, LH: 300, t: 0, dt: 0.07, dim: 0, sig: '', tasks: [], vid: 0, sky: 'day', counts: { working: 0, waiting: 0, idle: 0 }, msg: '', focus: null, frames: 0, dyn: { coffees: [] } };
const E = { fy: 0, open: 0, moving: false, queue: [], rider: null, use: new Map(), ding: null };
const BS = { react: -9, style: styleFor('boss', true) };

const T0 = () => (HUD ? HUDH : 0) + ROOFH;
const fIdx = (id) => { const i = S.floors.indexOf(id); return i < 0 ? S.floors.length - 1 : i; };
const floorTop = (i) => T0() + i * S.Hf;
const footY = (i) => floorTop(i) + S.Hf - FB;
const EXC = () => S.LW - BM - 2 - SHAFT / 2;
const zl = () => BM + LABW + 4;
const zr = () => S.LW - BM - SHAFT - 8;
const cellsFor = (rid) => Math.max(3, (S.slots.get(rid) || []).length);
const pitchOf = (rid) => (zr() - zl()) / cellsFor(rid);
const slotX = (rid, k) => Math.round(zl() + pitchOf(rid) * (k + 0.5) - 12);
const cabH = () => Math.min(38, S.Hf - FB - 10);
const cabFoot = () => T0() + (E.fy + 1) * S.Hf - FB;
const bossX = () => Math.round(zl() + (zr() - zl()) * 0.26);
const bossSpot = () => bossX() + 5 + BOSS_DESK_W + 10;
const yOf = (a) => (a.inCab ? Math.round(cabFoot()) : footY(fIdx(a.fr)));

function spawn(gen) { const task = { gen, done: false }; S.tasks.push(task); gen.next(); return task; }
function* tween(d, fn) { let t = 0; while (t < d) { t += yield; fn(Math.min(1, t / d)); } fn(1); }
function* wait(s) { let t = 0; while (t < s) t += yield; }
function* until(cond) { while (!cond()) yield; }

function newAgent(d) {
  return { id: d.id, name: d.name, state: d.state, sleepy: !!d.sleepy, room: d.room, fr: d.room, slot: -1, x: 0, sit: 1, facing: 1, phase: 0, walking: false, away: false, inCab: false, alpha: 1, bubble: null, gone: false, visitor: false, hop: 0, react: -9, seed: hash(d.id), st: styleFor(d.id) };
}

function applyState(s) {
  const present = new Set();
  for (const d of s.agents) {
    present.add(d.id);
    let a = S.agents.get(d.id);
    if (!a) { a = newAgent(d); S.agents.set(a.id, a); }
    a.name = d.name; a.state = d.state; a.sleepy = !!d.sleepy; a.gone = false;
    if (a.room !== d.room) { a.room = d.room; if (!a.away) a.fr = d.room; }
  }
  for (const [id, a] of [...S.agents]) {
    if (a.visitor || present.has(id)) continue;
    if (a.away) a.gone = true; else S.agents.delete(id);
  }
  S.rooms = s.rooms.map((r) => ({ id: r.id, label: r.label }));
  const roomIds = new Set(S.rooms.map((r) => r.id));
  const slots = new Map();
  for (const r of S.rooms) {
    const prev = (S.slots.get(r.id) || []).map((id) => { const a = S.agents.get(id); return a && !a.gone && a.room === r.id ? id : null; });
    const arr = prev.slice();
    for (const d of s.agents) {
      if (d.room !== r.id || arr.includes(d.id)) continue;
      const free = arr.indexOf(null);
      if (free >= 0) arr[free] = d.id; else if (arr.length < MAXS) arr.push(d.id);
    }
    while (arr.length && arr[arr.length - 1] === null) arr.pop();
    slots.set(r.id, arr);
  }
  S.slots = slots;
  for (const a of S.agents.values()) {
    if (a.visitor) continue;
    const arr = slots.get(a.room);
    a.slot = arr ? arr.indexOf(a.id) : -1;
    if (a.slot < 0 && !a.away) S.agents.delete(a.id);
  }
  S.floors = [BOSS, ...S.rooms.map((r) => r.id), LOBBY];
  for (const a of S.agents.values()) if (!roomIds.has(a.fr) && a.fr !== LOBBY && a.fr !== BOSS && !a.away) a.fr = a.room;
  E.fy = clamp(E.fy, 0, S.floors.length - 1);
  const list = [...S.agents.values()].filter((a) => !a.visitor);
  const c = { working: 0, waiting: 0, idle: 0 };
  for (const a of list) c[a.state]++;
  S.counts = c;
  S.msg = '';
  statEl.textContent = `${c.working} working, ${c.waiting} waiting, ${c.idle} idle (${DEMO ? 'demo' : 'live'})`;
  const sig = S.rooms.map((r) => r.id + r.label + (slots.get(r.id) || []).map((id) => { const a = id && S.agents.get(id); return a ? a.name : '-'; }).join(',')).join('|') + `:${c.working}:${c.waiting}:${c.idle}`;
  const changed = sig !== S.sig;
  S.sig = sig;
  S.working = c.working + c.waiting;
  S.total = list.length;
  if (changed || !S.ready) layout(); else snapSeated();
}

function snapSeated() {
  for (const a of S.agents.values()) {
    if (a.away || a.visitor || a.slot < 0) continue;
    a.fr = a.room; a.x = slotX(a.room, a.slot); a.sit = 1; a.facing = 1; a.walking = false; a.hop = 0;
  }
}

function measure() {
  const dpr = window.devicePixelRatio || 1, n = S.floors.length;
  const devW = Math.max(1, stageEl.clientWidth * dpr), devH = Math.max(1, stageEl.clientHeight * dpr);
  const t0 = T0(), hmin = t0 + n * HF_MIN + GRND;
  const sW = Math.max(1, Math.floor(devW / MINLW + 1e-6));
  const sH = Math.max(1, Math.floor(devH / hmin));
  const cap = Math.max(1, Math.round(2 * dpr));
  let s = sW;
  if (s > cap) s = Math.max(cap, Math.min(sW, sH));
  S.s = s; S.dpr = dpr;
  S.LW = clamp(Math.floor(devW / s), 340, MAXLW);
  S.Hf = clamp(Math.floor((devH / s - t0 - GRND) / n), HF_MIN, HF_MAX);
  S.LH = t0 + n * S.Hf + GRND;
}

function layout() {
  measure();
  cv.width = S.LW; cv.height = S.LH; stCv.width = S.LW; stCv.height = S.LH;
  cv.style.width = (S.LW * S.s / S.dpr) + 'px'; cv.style.height = (S.LH * S.s / S.dpr) + 'px';
  ctx.imageSmoothingEnabled = false; stC.imageSmoothingEnabled = false;
  S.ready = true;
  snapSeated();
  drawStatic();
}

const R = (c, x, y, w, h, col) => { c.fillStyle = PAL[col] || col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const px = (c, x, y, col) => R(c, x, y, 1, 1, col);
function blob(c, cx, cy, rx, ry, col) {
  c.fillStyle = PAL[col] || col;
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) if ((x * x) / (rx * rx + 0.5) + (y * y) / (ry * ry + 0.5) <= 1) c.fillRect(cx + x, cy + y, 1, 1);
}

function* walkTo(a, tx) {

  a.x = tx; a.walking = false;
}

  a.hop = 0; a.sit = 0;
}

  if (to === 1) E.ding = { f: Math.round(E.fy), t0: S.t };
}

function* elevatorProc() {
  for (;;) {
    if (!E.queue.length) { yield; continue; }
    const r = E.queue[0];
    yield* moveCab(r.from);
    yield* doors(1);
    r.state = 'board';
    while (r.state !== 'in') yield;
    E.queue.shift(); E.rider = r.a;
    yield* wait(0.15);
    yield* doors(0);
    yield* moveCab(clamp(r.to, 0, S.floors.length - 1));
    yield* doors(1);
    r.state = 'exit';
    while (r.state !== 'out') yield;
    E.rider = null;
    yield* wait(0.3);
    yield* doors(0);
  }
}

function* ride(a, toRoom) {

  E.queue.push(r);
  yield* until(() => r.state === 'board');
  E.use.set(from, Math.max(0, (E.use.get(from) || 1) - 1));
  yield* walkTo(a, EXC());
  a.facing = 1; a.inCab = true; r.state = 'in';
  yield* until(() => r.state === 'exit');
  a.inCab = false; a.fr = S.floors[clamp(to, 0, S.floors.length - 1)]; r.state = 'out';
}

function* goTo(a, room, x) {

    const f0 = fIdx(a.fr), k = E.use.get(f0) || 0;
    E.use.set(f0, k + 1);
    yield* walkTo(a, EXC() - 24 - 12 * k);
    yield* ride(a, room);
  }
  yield* walkTo(a, x);
}

const homeOf = (a) => (a.visitor ? { room: LOBBY, x: BM + 14 } : { room: a.room, x: slotX(a.room, Math.max(0, a.slot)) });

function* leaveAndSit(a) {

  const b = S.agents.get(bid);
  if (b && !b.gone && b.slot >= 0) {
    yield* goTo(a, b.room, slotX(b.room, b.slot) - VIS_DX);
    a.facing = 1;
    yield* wait(0.2);
    a.bubble = { text, t0: S.t }; b.react = S.t;
    yield* wait(2.4);
    a.bubble = null;
    yield* wait(0.15);
  }
  yield* leaveAndSit(a);
}

function makeVisitor() {
  const a = newAgent({ id: 'v' + (++S.vid), name: 'Guest', state: 'idle', room: LOBBY });
  a.visitor = true; a.slot = -1; a.fr = LOBBY; a.x = BM + 14; a.sit = 0;
  S.agents.set(a.id, a);
  return a;
}

function startTrip(fromId, toId, text) {
  const target = S.agents.get(toId);
  if (!target || target.gone || target.slot < 0) return false;
  let a = S.agents.get(fromId);
  if (!a || a.gone) a = makeVisitor();
  else if (a.away || a.slot < 0) return false;
  spawn(trip(a, toId, up(text)));
  return true;
}

function* focusTrip(a, token) {
  const alive = () => S.focus && S.focus.token === token;
  a.away = true;
  if (a.visitor) { a.fr = LOBBY; a.x = BM + 14; a.sit = 0; a.facing = 1; yield* wait(0.2); }
  else yield* stand(a);
  if (alive()) {
    yield* goTo(a, BOSS, bossSpot());
    a.facing = -1;
    if (alive()) {
      yield* wait(0.2);
      BS.react = S.t; S.focusVisitor = a;
      a.bubble = { text: BOSS_TEXTS[hash(token) % BOSS_TEXTS.length], t0: S.t };
      yield* until(() => !alive());
      a.bubble = null; S.focusVisitor = null;
      yield* wait(0.3);
    }
  }
  yield* leaveAndSit(a);
}

function setFocus(agentId, at) {
  if (!agentId) { S.focus = null; return; }
  const token = agentId + ':' + at;
  if (S.focus && S.focus.token === token) return;
  S.focus = { token, agentId };
  spawn((function* () {
    const target = () => S.agents.get(agentId);
    const stale = () => !S.focus || S.focus.token !== token;
    let a;
    if (agentId === 'visitor' || !target()) a = makeVisitor();
    else {
      yield* until(() => { const x = target(); return !x || stale() || (!x.away && x.slot >= 0); });
      a = target();
      if (!a || stale()) return;
    }
    yield* focusTrip(a, token);
  })());
}

const seen = new Set();
let firstLoad = true;
function handleEvents(s) {
  const now = s.generatedAt || Date.now();
  for (const e of s.events || []) {
    if (seen.has(e.id)) continue;
    seen.add(e.id);
    if (firstLoad && now - e.at > 8000) continue;
    if (now - e.at > 20000) continue;
    startTrip(e.from, e.to, TEXTS[hash(e.id) % TEXTS.length]);
  }
  if (seen.size > 500) { const keep = [...seen].slice(-200); seen.clear(); keep.forEach((k) => seen.add(k)); }
  if (s.focus && s.focus.agentId) setFocus(s.focus.agentId, s.focus.at); else setFocus(null);
  firstLoad = false;
}

function hudMessage(m) { S.msg = m; statEl.textContent = m; if (S.ready) drawStatic(); }

async function poll() {
  if (document.hidden) return;
  try {
    const r = await fetch('state.json', { cache: 'no-store' });
    const s = await r.json();
    applyState(s); handleEvents(s);
  } catch {
    hudMessage('offline - run node scan.mjs');
  }
}

function startDemo() {
  const Rn = rng(Number(Q.get('seed')) || 7);
  const rooms = [{ id: 'dashboard', label: 'dashboard' }, { id: 'gateway', label: 'gateway' }, { id: 'infra', label: 'infra' }, { id: 'docs', label: 'docs' }];
  const who = [['Fern', 'gateway', 'working'], ['Moss', 'gateway', 'idle'], ['Juniper', 'gateway', 'waiting'], ['Pebble', 'dashboard', 'working'], ['Sage', 'dashboard', 'working'], ['Wren', 'dashboard', 'idle'], ['Basil', 'docs', 'idle'], ['Cedar', 'docs', 'working'], ['Clover', 'infra', 'waiting'], ['Ash', 'infra', 'idle']];
  const agents = who.map(([name, room, state]) => ({ id: 'd_' + name.toLowerCase(), name, room, state, sleepy: name === 'Basil' }));
  const push = () => applyState({ rooms, agents, events: [] });
  push();
  const pick = (arr) => arr[Math.floor(Rn() * arr.length)];
  let night = false;
  spawn((function* () {
    for (;;) {
      yield* wait(2.2 + Rn() * 2.8);
      if (night) continue;
      const a = pick(agents);
      const working = agents.filter((x) => x.state === 'working').length;
      if (a.state === 'working') a.state = Rn() < 0.35 && working > 2 ? 'waiting' : 'idle';
      else a.state = 'working';
      a.sleepy = a.state === 'idle' && Rn() < 0.3;
      push();
    }
  })());
  spawn((function* () {
    yield* wait(1.2);
    for (;;) {
      const free = agents.filter((x) => { const o = S.agents.get(x.id); return o && !o.away; });
      if (free.length > 1 && !night && agents.length - free.length < 3) {
        const from = pick(free);
        const others = agents.filter((x) => x !== from);
        const far = others.filter((x) => x.room !== from.room);
        startTrip(from.id, (Rn() < 0.75 ? pick(far) : pick(others)).id, pick(TEXTS));
      }
      yield* wait(3 + Rn() * 2.5);
    }
  })());
  if (AUTOFOCUS) spawn((function* () {
    let i = 0;
    yield* wait(5);
    for (;;) {
      yield* until(() => !night && agents.filter((x) => { const o = S.agents.get(x.id); return o && o.away; }).length < 3);
      setFocus(agents[i % agents.length].id, 'demo' + i); i++;
      yield* wait(12 + Rn() * 3);
    }
  })());
  spawn((function* () {
    for (;;) {
      yield* wait(75);
      night = true;
      for (const a of agents) { a.state = 'idle'; a.sleepy = Rn() < 0.5; }
      push();
      yield* wait(16);
      night = false;
      for (const a of agents) if (Rn() < 0.6) { a.state = 'working'; a.sleepy = false; }
      push();
    }
  })());
}

function step(dt) {
  S.dt = dt; S.t += dt;
  for (const task of [...S.tasks]) {
    const r = task.gen.next(dt);
    if (r.done) S.tasks.splice(S.tasks.indexOf(task), 1);
  }
}

let raf = 0, last = 0;
function frame(now) {
  raf = requestAnimationFrame(frame);
  if (now - last < 1000 / 15 - 3) return;
  const dt = Math.min(0.1, (now - last) / 1000) * SPEED;
  last = now;
  S.frames++;
  step(dt);
  draw(S.t);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); if (!DEMO) poll(); }
});
let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 100); });

spawn(elevatorProc());
measure();
if (DEMO) startDemo();
else if (location.protocol.startsWith('http')) { poll(); setInterval(poll, 2500); }
else { applyState({ rooms: [], agents: [], events: [] }); hudMessage('run scan.mjs or ?demo=1'); }
if (!S.ready) layout();
raf = requestAnimationFrame(frame);

window.__office = {
  scale: () => S.s / S.dpr, px: () => S.s, hf: () => S.Hf, dpr: () => S.dpr, frames: () => S.frames, world: () => ({ w: S.LW, h: S.LH }),
  floors: () => S.floors.map((id, i) => ({ id, top: floorTop(i), foot: footY(i) })),
  labels: () => S.floors.map((id, i) => labelLines(id).rows.map((r, j) => ({ id, x: BM + 3, y: floorTop(i) + 7 + j * 8, w: textW(r.t), h: 7 }))).flat(),
  desks: () => { const o = []; for (const [rid, arr] of S.slots) arr.forEach((aid, k) => { if (aid) o.push({ id: aid, room: rid, x: slotX(rid, k), y: footY(fIdx(rid)) }); }); return o; },
  agents: () => [...S.agents.values()].map((a) => ({ id: a.id, name: a.name, state: a.state, room: a.room, fr: a.fr, x: a.x, y: yOf(a), sit: a.sit, away: a.away, inCab: a.inCab, visitor: a.visitor, bubble: a.bubble ? bubbleRect(a) : null })),
  elevator: () => ({ fy: E.fy, open: E.open, queue: E.queue.length, rider: E.rider ? E.rider.id : null, x: EXC(), foot: cabFoot(), h: cabH() }),
  boss: () => ({ x: bossX(), foot: footY(0), spot: bossSpot(), desk: { x: bossX() - 12, y: footY(0) - 25, w: BOSS_DESK_W + 17, h: 25 }, floor: BOSS }),
  focus: (id, at) => { setFocus(id, at || String(Date.now())); return true; },
  clearFocus: () => setFocus(null),
  trip: (fromId, toId, text) => startTrip(fromId, toId || '', text || TEXTS[0]),
  dim: () => S.dim,
  sky: () => S.sky,
};
})();
</script>
