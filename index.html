function* ride(a, toRoom) {

  E.use.set(fromRoom, Math.max(0, (E.use.get(fromRoom) || 1) - 1));
  yield* walkTo(a, EXC());
  a.facing = 1; a.inCab = true; r.state = 'in';
  yield* until(() => r.state === 'exit');
  a.inCab = false; a.fr = S.floors.includes(toRoom) ? toRoom : LOBBY; r.state = 'out';
}

function* goTo(a, room, x) {

    const f0 = a.fr, k = E.use.get(f0) || 0;

    yield* walkTo(a, EXC() - 24 - 12 * k);

}

function* leaveAndSit(a) {

  yield* goTo(a, h.room, h.x);
  if (a.visitor) { S.agents.delete(a.id); return; }
  yield* sitDown(a);
  a.away = false; a.spd = 0; a.fr = a.room; a.x = slotX(a.room, Math.max(0, a.slot)); a.sit = 1; a.facing = 1; a.walking = false; a.hop = 0;
  if (a.gone) S.agents.delete(a.id);
}

function freeSeat(a) {

function* leaveTask(a) {

function* trip(a, bid, text) {

function* bossVisit(id) {

function* focusTrip(a, token, fromLine) {

function setFocus(agentId, at) {

function* queueTask(a) {

  a.q = false;
  yield* leaveAndSit(a);
}

  const sk = UI.items.find((i) => i.kind === 'skip');
  uT(info, sk.x - 6 - textW(info), sk.y + 2, '#94b0c2');
  for (const it of UI.items) {
    if (it.kind === 'next') button(it, !typing && Math.floor(t * 2.5) % 2 ? '#a7f070' : T.step === STEPS.length - 1 ? '#ffcd75' : '#38b764', '#1a1c2c', T.step === STEPS.length - 1 ? 'DONE' : 'NEXT');
    else if (it.kind === 'skip') button(it, '#333c57', '#d6d6e0', 'SKIP');
  }
}

function drawUi(t) {
  uctx.clearRect(0, 0, U.W, U.H);
  if (UI.settings) drawPanel();
  if (UI.tour) { drawStrip(t); drawDialog(t); }
  for (const p of S.particles) { uctx.fillStyle = p.col; uctx.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz); }
}

function stepUi(dt) {
  if (S.anim) {
    const k = (S.t - S.anim.t0) / S.anim.dur;
    S.anim.p = ease(clamp(k, 0, 1));
    S.anim.ps = ease(clamp(k / 0.6, 0, 1));
    S.anim.pf = S.anim.out.length ? ease(clamp((k - 0.4) / 0.6, 0, 1)) : S.anim.p;
    if (k >= 1) { if (S.anim.keepH > S.LH) setCanvasH(S.LH); S.anim = null; S.fc = null; S.bgCv = null; E.fid = null; }
  }
  const T = UI.tour;
  if (T) T.shown = Math.min(T.text.length, Math.floor((S.t - T.t0) * TYPE_CPS));
  if (S.particles.length) {
    for (const p of S.particles) { p.vy += 140 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    S.particles = S.particles.filter((p) => p.life > 0 && p.y < U.H + 4);
    if (!S.particles.length) UI.dirty = true;
  }
}

const wasActive = { v: false };
function renderUi(t) {
  if (UI.dirty && !UI.drag) { uiLayout(); syncHit(); UI.dirty = false; }
  const on = uiActive();
  if (on !== wasActive.v) { wasActive.v = on; uiEl.classList.toggle('on', on); }
  if (on) drawUi(t);
}

S.set = { ...DEF_SET };

function step(dt) {
  S.dt = dt; S.t += dt;
  for (const task of [...S.tasks]) {
    const r = task.gen.next(dt);
    if (r.done) S.tasks.splice(S.tasks.indexOf(task), 1);
  }
  stepUi(dt);
}

let raf = 0, last = 0;
function frame(now) {
  raf = requestAnimationFrame(frame);
  if (now - last < 1000 / 15 - 3) return;
  const dt = Math.min(0.1, (now - last) / 1000) * SPEED * (DEMO ? S.set.speed : 1);
  last = now;
  S.frames++;
  step(dt);
  draw(S.t);
  renderUi(S.t);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); if (!DEMO) poll(); }
});
let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 100); });

spawn(elevatorProc());
spawn(queueProc());
spawn(bossProc());
measure();
if (DEMO) { S.set = cleanSet(lsRead()); S.setReady = true; startDemo(); }
else if (location.protocol.startsWith('http')) loadSettings().then(() => { poll(); setInterval(poll, 2500); });
else { S.set = cleanSet(lsRead()); S.setReady = true; S.tourChecked = true; applyState({ rooms: [], agents: [], events: [] }); hudMessage('run scan.mjs or ?demo=1'); }
if (!S.ready) layout();
raf = requestAnimationFrame(frame);

window.__office = {
  scale: () => S.s / S.dpr, px: () => S.s, hf: () => S.Hf, dpr: () => S.dpr, frames: () => S.frames, world: () => ({ w: S.LW, h: S.LH }),
  floors: () => S.floors.map((id, i) => ({ id, top: floorTop(i), foot: footY(i), y: floorTop(fIdx(id)) })),
  labels: () => S.floors.map((id, i) => labelLines(id).rows.map((r, j) => ({ id, x: BM + 3, y: floorTop(i) + 7 + j * 8 + (r.sm ? 1 : 0), w: fitW(r.t, r.sm), h: r.sm ? 5 : 7, t: r.t, sm: !!r.sm }))).flat(),
  desks: () => { const o = []; for (const [rid, arr] of S.slots) arr.forEach((aid, k) => { if (aid) o.push({ id: aid, room: rid, x: slotX(rid, k), y: footY(fIdx(rid)) }); }); return o; },
  agents: () => [...S.agents.values()].map((a) => ({ id: a.id, name: a.name, state: a.state, room: a.room, fr: a.fr, x: a.x, y: yOf(a), sit: a.sit, away: a.away, queued: a.q && a.fr === BOSS && !a.walking && !a.inCab, settled: settledAway(a), q: a.q, title: a.title, walking: a.walking, facing: a.facing, inCab: a.inCab, visitor: a.visitor, gone: a.gone, leaving: !!a.leaving, alpha: a.alpha, bubble: a.bubble ? bubbleRect(a) : null })),
  elevator: () => ({ fy: E.fy, open: E.open, queue: E.queue.length, rider: E.rider ? E.rider.id : null, x: EXC(), foot: cabFoot(), h: cabH() }),
  boss: () => ({ x: bossX(), foot: footY(0), spot: bossSpot(), desk: { x: bossX() - 12, y: footY(0) - 25, w: BOSS_DESK_W + 17, h: 25 }, floor: BOSS }),
  focus: (id, at) => { setFocus(id, at || String(Date.now())); return true; },
  clearFocus: () => setFocus(null),
  bossActor: () => ({ x: B.x, y: yOf(B), fr: B.fr, away: B.away, sit: B.sit, inCab: B.inCab, bubble: B.bubble ? bubbleRect(B) : null, desk: B.fr === BOSS ? null : null, chair: bossX(), visits: S.visits.length }),
  visit: (id) => pushVisit(id),
  visitLog: () => S.visitLog.map((v) => ({ ...v })),
  join: (np) => (window.__demoJoin ? window.__demoJoin(np) : null),
  secretary: () => ({ x: secX(), waving: S.t - SEC.t0 < 1.4 }),
  trip: (fromId, toId, text) => startTrip(fromId, toId || '', text || TEXTS[0]),
  dim: () => S.dim,
  queue: () => ({ queue: S.queue.slice(), want: S.want.slice(), cap: lineCap(), door: doorX(), hall: hallW(), spots: S.want.map((id, k) => lineX(k)), foot: footY(0), spot: bossSpot() }),
  rooms: () => S.rooms.map((r) => ({ id: r.id, label: r.label })),
  load: (st) => { applyState(st); return true; },
  fold: (t) => fold(t),
  sign: () => ({ x: BM + 3, max: LABT, inner: LABW - 2 }),
  settings: () => ({ ...S.set }),
  server: () => SERVER,
  animating: () => !!S.anim,
  anim: () => (S.anim ? { p: S.anim.p, pf: S.anim.pf, ps: S.anim.ps, out: S.anim.out.length } : null),
  apply: (raw) => applyState(raw),
  animations: () => S.animCount || 0,
  particles: () => S.particles.length,
  ui: () => ({ settings: UI.settings, tour: UI.tour ? { step: UI.tour.step, shown: UI.tour.shown, len: UI.tour.text.length, text: UI.tour.text, did: UI.tour.did } : null, U: { ...U }, dialog: UI.dialog, strip: UI.strip, geo: UI.geo ? { x: UI.geo.x, y: UI.geo.y, w: UI.geo.w, h: UI.geo.h, rows: UI.geo.rows, n: UI.geo.n } : null, dpr: window.devicePixelRatio || 1, canvas: (() => { const r = uc.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; })() }),
  sky: () => S.sky,
};
})();
</script>
